# Cloudflare Workers + static assets (works with: npx wrangler deploy)
# Build: npm run build
# Output assets: ./dist
name = "theislecheats"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
